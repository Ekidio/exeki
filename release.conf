# Release settings, read by build.sh and make-release.sh.

# The GitHub repository that hosts the releases, e.g. "felhasznalonev/exeki".
# It is used for:
#  - automatic updates: the app checks
#    https://github.com/<GITHUB_REPO>/releases/latest/download/appcast.xml
#  - engine mirror: the app first tries to download Wine/DOSBox from the "engines" release
#    of this repository (see prepare-engines.sh), and only then from their original sites.
# Leave empty to build without automatic updates.
GITHUB_REPO="Ekidio/exeki"
